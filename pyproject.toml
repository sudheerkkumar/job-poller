[project]
name = "job-poller"
version = "0.1.0"
description = "Self-hosted job radar: watches company job boards (and optionally LinkedIn), screens new jobs against your profile with an LLM, alerts you on Telegram."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "google-genai>=1.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
job-poller = "jobpoller.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpoller*"]

[tool.setuptools.package-data]
jobpoller = ["db/migrations/*.sql"]

[tool.ruff]
line-length = 135
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]

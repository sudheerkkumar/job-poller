# docker compose -f docker-compose.test.yml run --rm tests   (throwaway Postgres, nothing kept)
name: job-poller-test
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      retries: 30
  tests:
    build: { context: ., target: test }
    depends_on: { db: { condition: service_healthy } }
    environment:
      TEST_DATABASE_URL: postgresql://test:test@db:5432/test
